# Скопируй в config.toml (он в .gitignore: ссылка на план и адрес в репозиторий не попадут).

# Ссылка на неделю в Рационе (racion.app/plan/…). Можно переопределить флагом --plan.
plan = "https://racion.app/plan/ВСТАВЬ-ID"

# Магазин доставки. Порядок: sap_code отсюда → адрес, выставленный на 5ka.ru в окне браузера → address.
# Надёжнее всего один раз выставить адрес руками на сайте (python -m r2c probe --wait).
address = "Россия, Санкт-Петербург, улица, дом"
# sap_code = "XXXX"
mode = "delivery"          # delivery — ассортимент и цены доставки; store — магазин у дома

include_pantry = false     # специи, масло, мука и т. п. («обычно есть дома» в Рационе)
skip = []                  # ingredientId, которые не покупать вовсе, напр. ["white_wine"]
tolerance = 0.03           # упаковка может быть на 3 % меньше нужного
pause_s = [1.5, 3.0]       # пауза между запросами к 5ka, секунды

# Общие предпочтения
prefer_brands = []         # напр. ["Простоквашино", "Экомилк"]: такие товары выигрывают при равенстве
avoid_words = ["корм для", "для кошек", "для собак", "детское пюре"]   # такие товары не предлагать

# Тонкая настройка по продукту. id — колонка ingredient_id в out/table.csv.
# query — что искать на 5ka; plu — закрепить конкретный товар; prefer_brands/avoid_words — как выше.
#
# [ingredients.milk]
# query = "молоко 3,2%"
# prefer_brands = ["Домик в деревне"]
#
# [ingredients.eggs]
# plu = "1234567"
