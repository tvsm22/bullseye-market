name: Push screen to SmallTV

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_egg:
        description: "Force-show the easter egg this run (for previewing it)"
        type: boolean
        default: false

jobs:
  push-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet paho-mqtt

      - name: Build the screen and publish it over MQTT
        env:
          FORCE_EGG: ${{ github.event.inputs.force_egg }}
        run: python3 .github/scripts/update_screen.py
