name: Update IMOEX quote

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_egg:
        description: "Force-show the easter egg this run (for previewing it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MOEX + build quote (occasionally an easter egg)
        env:
          FORCE_EGG: ${{ github.event.inputs.force_egg }}
        run: python3 .github/scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "quotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add quotes/imoex.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "update quote"
            git push
          fi
